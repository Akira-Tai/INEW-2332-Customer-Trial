<div>
  <h2>Customer Management</h2>
  
  <form (ngSubmit)="saveCustomer()">
    <!-- Notice we call the signal like a function: currentCustomer().propertyName -->
    <input [(ngModel)]="currentCustomer().name" name="name" placeholder="Name" required />
    <input [(ngModel)]="currentCustomer().addressLine1" name="addressLine1" placeholder="Address Line 1" required />
    <input [(ngModel)]="currentCustomer().addressLine2" name="addressLine2" placeholder="Address Line 2" />
    <input [(ngModel)]="currentCustomer().city" name="city" placeholder="City" required />
    <input [(ngModel)]="currentCustomer().state" name="state" placeholder="State" required />
    <input [(ngModel)]="currentCustomer().zip" name="zip" placeholder="Zip" required />
    
    <button type="submit">{{ isEditing() ? 'Update' : 'Create' }}</button>
    <button type="button" (click)="resetForm()">Cancel</button>
  </form>

  <table border="1" style="margin-top: 20px; width: 100%;">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Address</th><th>City</th><th>State</th><th>Zip</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Modern @for control flow with tracking for better performance -->
      @for (customer of customers(); track customer.id) {
        <tr>
          <td>{{ customer.id }}</td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.addressLine1 }} {{ customer.addressLine2 }}</td>
          <td>{{ customer.city }}</td>
          <td>{{ customer.state }}</td>
          <td>{{ customer.zip }}</td>
          <td>
            <button (click)="editCustomer(customer)">Edit</button>
            <button (click)="deleteCustomer(customer.id!)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7" style="text-align: center;">No customers found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
